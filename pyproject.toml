[project]
name = "opendp-cookbook"
version = "0.1.0"
description = "A collection of recipes for the OpenDP library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib==3.11.0",
    "opendp[polars]==0.15.1",
    "pandas==3.0.5",
    "pydata-sphinx-theme==0.20.0",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "dp-wizard-templates>=0.9.0",
    "myst-parser>=5.1.0",
    "nbsphinx>=0.9.8",
    "pre-commit>=4.6.2",
    "sphinx>=9.1.0",
]
