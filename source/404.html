<!DOCTYPE html>
<html>
    <!--
        Since this will be copied up to the top level, we don't want to depend on any static assets.
        Easiest just to write raw HTML and skip Sphinx altogether.
    -->
    <head>
        <title>Page not found &mdash; OpenDP</title>
        <style>
            * {
                font-family: -apple-system, BlinkMacSystemFont, Segoe UI, "Helvetica Neue", Arial, sans-serif;
            }
            
        </style>
    </head>
    <body>
        <div id="default">
            <h1>Page not found</h1>
            <p>
                The page you are looking for doesn't exist.
            </p>
        </div>
        <script>
            (function(){
                const url = document.location.toString();
    
                const pairs = Object.entries({
                    // If we move pages around, add path mapping here.
                });
                
                for ([old_fragment, new_fragment] of pairs) {
                    if (url.includes(old_fragment)) {
                        const new_url = url.replace(old_fragment, new_fragment)
                        document.getElementById("default").remove();
                        document.write(`
                            <h1>Site has changed</h1>
                            <p>Our site structure has changed: Redirecting to <code>${new_url}</code> in five seconds...</p>
                        `);
                        setTimeout(function() {
                            document.location = new_url;
                        }, 5000);
                        break;
                    }
                };
            })();
        </script>
    </body>
</html>
