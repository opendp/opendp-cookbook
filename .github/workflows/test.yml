on:
    pull_request:


jobs:

  docs:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Make sure we get all refs
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19.2

      - run: pip install -r requirements.txt

      - run: make html
